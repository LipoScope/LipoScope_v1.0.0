name: LipoScope validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m py_compile scripts/*.py scripts/ccrf/*.py tests/*.py
      - run: python -m pytest -q
      - run: python scripts/18_browser_smoke_test.py --html LipoScope.html
      - run: python scripts/20_generate_validation_reports.py
