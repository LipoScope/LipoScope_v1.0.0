name: LipoScope validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/19_embed_jszip.py
      - run: git diff --exit-code
      - run: python -m py_compile scripts/*.py scripts/ccrf/*.py tests/*.py
      - run: python -m pytest -q
      - run: python scripts/18_browser_smoke_test.py --html LipoScope.html
      - run: python scripts/24_browser_topic_category_regression.py --html LipoScope.html --out validation/topic_category_browser_regression.json
      - run: python scripts/25_browser_live_search_regression.py --html LipoScope.html --out validation/live_search_browser_regression.json
      - run: python scripts/26_browser_analytics_snapshot_regression.py --html LipoScope.html --out validation/analytics_snapshot_browser_regression.json
      - run: python scripts/20_generate_validation_reports.py
